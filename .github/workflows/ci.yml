name: CI

on:
    push:
        branches: [master]
    pull_request:

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - run: npm ci

            - name: Check formatting
              run: npx prettier --check "{src,scripts,tests}/**/*.{js,mjs,scss}"

            - name: Lint
              run: npm run lint

            - name: Test
              run: npm test

            # Proves the extension actually builds and that every file the manifest
            # references exists — the manifest test only checks build/ when present.
            - name: Build
              run: npm run build

            - name: Verify packaged manifest
              run: npm test -- tests/manifest.test.js

            - name: Package
              run: npm run release

            - uses: actions/upload-artifact@v4
              with:
                  name: extension
                  path: releases/*.zip
